name: Docs deploy

# Builds the docs site and uploads it to Cloudflare Pages. Pushes to main go
# to the `next` branch alias (next.forms.lunarhue.dev), since main documents
# unreleased APIs. Production follows releases instead: docs-production.yml.
# Pull requests from this repo get a preview at
# <branch>.lunarhue-forms-docs.pages.dev; forks get none, since they can't
# read the secrets. CI tests the site, so this only builds, uploads and, for
# `next`, reports a smoke test.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions: {}

# A newer push to the same branch replaces a deploy in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # The repository check keeps forks' copies of the workflow quiet. Pull
    # requests must come from a branch of this repo.
    if: >-
      github.repository == 'LunarHUE/forms'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the preview comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: each page's "Last updated" date and sitemap lastmod
          # come from git, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The packageManager field pins Bun.
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Until the Cloudflare secrets are set, skip the deploy with a notice
      # instead of failing every run.
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set, so the docs aren't deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Pages names a preview after its branch: lowercase letters, digits and
      # dashes. main becomes `next`. A pull request branch that would land on
      # one of the reserved names gets a prefix instead: `main` is the
      # production branch, `next` serves main, and docs-production.yml tests
      # each release at `release-candidate`.
      - id: branch
        if: steps.secrets.outputs.ready == 'true'
        env:
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if [ "$REF" = main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            branch=next
          else
            branch=$(printf '%s' "$REF" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-28)
            case "$branch" in
              main | next | release-candidate) branch="pr-$branch" ;;
            esac
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/docs
        env:
          # The next site labels itself "next" in the version picker and stays
          # out of search. Previews build like a release.
          DOCS_CHANNEL: ${{ steps.branch.outputs.name == 'next' && 'next' || '' }}
          # A preview's Markdown copies and llms files link to the preview
          # itself. next and production link to their own sites.
          DOCS_URL: ${{ steps.branch.outputs.name != 'next' && format('https://{0}.lunarhue-forms-docs.pages.dev', steps.branch.outputs.name) || '' }}
        run: bun run build

      - id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          command: pages deploy apps/docs/dist --project-name=lunarhue-forms-docs --branch=${{ steps.branch.outputs.name }}

      - if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "Deployed to $URL"
            if [ -n "$ALIAS" ]; then echo ""; echo "Branch alias: $ALIAS"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, found again by its marker and edited on
      # each push. The Version Packages pull request gets it too, worded for
      # the release; docs-production.yml updates it once the release is live.
      # A failed comment doesn't fail the deploy.
      - if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          RELEASE: ${{ github.head_ref == 'changeset-release/main' }}
        run: |
          marker="<!-- docs-deploy -->"
          if [ "$RELEASE" = true ]; then heading="Docs for this release"; else heading="Docs preview"; fi
          body="$marker
          **$heading**, built from $SHA

          | | |
          | --- | --- |
          | Branch | ${ALIAS:-$URL} |
          | This commit | $URL |"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      # `next` only reports: a failure shows as a warning on the run and in
      # its summary, and blocks nothing. The production gate runs the same
      # script before it promotes a release.
      - id: smoke
        if: steps.secrets.outputs.ready == 'true' && steps.branch.outputs.name == 'next'
        continue-on-error: true
        working-directory: apps/docs
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo ""
            echo "### Smoke test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          bun run smoke "$URL" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: steps.smoke.outcome == 'failure'
        run: echo "::warning::The smoke test failed on next. The deploy stays up; see the run summary."
