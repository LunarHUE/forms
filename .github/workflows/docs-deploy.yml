name: Docs deploy

# Builds the docs site and uploads it to Cloudflare Pages. Pushes to main go
# to production. Pull requests from this repo get a preview at
# <branch>.lunarhue-forms-docs.pages.dev; forks get none, since they can't
# read the secrets. CI tests the site, so this only builds and uploads.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions: {}

# A newer push to the same branch replaces a deploy in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # The repository check keeps forks' copies of the workflow quiet. Pull
    # requests must come from a branch of this repo.
    if: >-
      github.repository == 'LunarHUE/forms'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: each page's "Last updated" date and sitemap lastmod
          # come from git, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The packageManager field pins Bun.
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Until the Cloudflare secrets are set, skip the deploy with a notice
      # instead of failing every run.
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set, so the docs aren't deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/docs
        run: bun run build

      # Pages names a preview after its branch: lowercase letters, digits and
      # dashes. main is the production branch.
      - id: branch
        if: steps.secrets.outputs.ready == 'true'
        env:
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          branch=$(printf '%s' "$REF" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-28)
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - id: deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          command: pages deploy apps/docs/dist --project-name=lunarhue-forms-docs --branch=${{ steps.branch.outputs.name }}

      - if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "Deployed to $URL"
            if [ -n "$ALIAS" ]; then echo ""; echo "Branch alias: $ALIAS"; fi
          } >> "$GITHUB_STEP_SUMMARY"
