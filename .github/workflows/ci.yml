name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 05:00 UTC, for the browsers job.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Every other run
# gets a group of its own, so runs on main are never cancelled or dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A branch rule requires checks and e2e by name, so they always run and
  # skip their steps on a docs-only change instead.
  checks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The docs-only check needs the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - if: steps.setup.outputs.docs-only == 'true'
        run: echo "Only docs changed, so there is nothing to check."
      - if: steps.setup.outputs.docs-only != 'true'
        run: bun run typecheck
      - if: steps.setup.outputs.docs-only != 'true'
        run: bun run lint
      - if: steps.setup.outputs.docs-only != 'true'
        run: bun run test
      - if: steps.setup.outputs.docs-only != 'true'
        run: bun run build
      # check:package and size read the build output.
      - if: steps.setup.outputs.docs-only != 'true'
        run: bun run check:package
      - if: steps.setup.outputs.docs-only != 'true'
        run: bun run size

  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # e2e:changed diffs against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - if: steps.setup.outputs.docs-only == 'true'
        run: echo "Only docs changed, so there is nothing to test."
      - if: steps.setup.outputs.docs-only != 'true'
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      # Pull requests run the frameworks their changes reach, main runs all.
      - if: steps.setup.outputs.docs-only != 'true' && github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: bun run e2e:changed --base "$BASE"
      - if: steps.setup.outputs.docs-only != 'true' && github.event_name == 'push'
        run: bun run e2e
      - if: failure() && steps.setup.outputs.docs-only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Every framework in each browser, one job per browser so a failure in one
  # shows on its own.
  browsers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # WebKit runs slower than Chromium, so this gets more room than e2e.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.browser }}
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/playwright-report
          retention-days: 7
