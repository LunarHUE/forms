name: Docs production

# Deploys the docs of the latest release to production (forms.lunarhue.dev).
# Production follows releases because main documents APIs that aren't on npm
# yet; main goes to `next` (docs-deploy.yml).
#
# The packages release as one fixed group, so the core package's tag marks
# every release. Pushing it, after `bun run release`, runs this. A manual run
# redeploys the latest release tag by default, or an explicit `ref` (such as
# `main`) to ship docs-only changes without cutting a package release.
#
# The gate: build once, upload the build to the `release-candidate` branch
# alias, smoke-test that deployment, and only then upload the same dist to
# the production branch.
on:
  push:
    tags:
      - "@lunarhue/forms-core@*"
      # Prereleases don't replace the stable docs.
      - "!@lunarhue/forms-core@*-*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (e.g. main or a commit SHA). Defaults to the latest release tag."
        required: false
        default: ""
        type: string

permissions: {}

# Production deploys queue and never cancel each other halfway. A run that is
# still waiting can be replaced by a newer one, which deploys the latest tag
# anyway.
concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy:
    # Forks get a copy of this workflow; only the real repo deploys.
    if: github.repository == 'LunarHUE/forms'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the release pull request's docs comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Brings every tag, to find the latest release, and the history each
          # page's "last updated" date comes from.
          fetch-depth: 0
          persist-credentials: false

      # Until the Cloudflare secrets are set, skip the deploy with a notice
      # instead of failing every run.
      - id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set, so the docs aren't deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Production shows the newest stable release unless a manual run asks for
      # an explicit ref (e.g. `main` for a docs-only update). A tag pushed for
      # an older line, such as a backported patch, would roll the docs back, so
      # that run stops here.
      - id: release
        if: steps.secrets.outputs.ready == 'true'
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT_REF" ]; then
            if ! printf '%s' "$INPUT_REF" | grep -Eq '^[A-Za-z0-9._/@-]+$' || printf '%s' "$INPUT_REF" | grep -Eq '(^-|\.\.)'; then
              echo "::error::Invalid ref \"$INPUT_REF\"."
              exit 1
            fi
            if resolved=$(git rev-parse --verify "${INPUT_REF}^{commit}" 2>/dev/null); then
              :
            elif resolved=$(git rev-parse --verify "refs/remotes/origin/${INPUT_REF}^{commit}" 2>/dev/null); then
              :
            elif resolved=$(git rev-parse --verify "refs/tags/${INPUT_REF}^{commit}" 2>/dev/null); then
              :
            else
              echo "::error::Could not resolve ref \"$INPUT_REF\" to a commit."
              exit 1
            fi
            echo "ref=$resolved" >> "$GITHUB_OUTPUT"
            echo "label=$INPUT_REF ($resolved)" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list '@lunarhue/forms-core@*' --sort=-version:refname | { grep -v '@[0-9.]*-' || true; } | sed -n 1p)
          if [ -z "$latest" ]; then
            echo "::error::No @lunarhue/forms-core release tag found."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$latest" ]; then
            echo "::notice::$GITHUB_REF_NAME isn't the latest release ($latest), so production stays as it is."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=refs/tags/$latest" >> "$GITHUB_OUTPUT"
          echo "label=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # The smoke test comes from the commit this workflow runs from, so a
      # manual run uses main's copy and a fix to the test reaches the next
      # re-run without a release. It reads only fetch and Node built-ins.
      # Then the chosen ref is checked out to build.
      - if: steps.release.outputs.deploy == 'true'
        env:
          REF: ${{ steps.release.outputs.ref }}
        run: |
          git show "$GITHUB_SHA:apps/docs/scripts/smoke.ts" > "$RUNNER_TEMP/smoke.ts"
          git checkout --detach "$REF"

      - if: steps.release.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The packageManager field pins Bun.
          bun-version-file: package.json
      - if: steps.release.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: steps.release.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.release.outputs.deploy == 'true'
        working-directory: apps/docs
        env:
          # Loads Cloudflare Web Analytics' beacon when the secret is set.
          CF_WEB_ANALYTICS_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_TOKEN }}
        run: bun run build

      # From apps/docs, for wrangler.jsonc and functions/, with Bun installing
      # Wrangler (docs-deploy.yml says why).
      - id: candidate
        if: steps.release.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          workingDirectory: apps/docs
          packageManager: bun
          command: pages deploy dist --project-name=lunarhue-forms-docs --branch=release-candidate

      # The deployment's own URL, not the alias, so the test reads exactly this build.
      - if: steps.release.outputs.deploy == 'true'
        env:
          URL: ${{ steps.candidate.outputs.deployment-url }}
          LABEL: ${{ steps.release.outputs.label }}
        run: |
          {
            echo "Target: $LABEL"
            echo ""
            echo "Candidate: $URL"
            echo ""
            echo "### Smoke test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          bun "$RUNNER_TEMP/smoke.ts" "$URL" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::The smoke test failed, so production stays as it is."
          fi
          exit "$status"

      # main is the Pages project's production branch.
      - id: production
        if: steps.release.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          workingDirectory: apps/docs
          packageManager: bun
          command: pages deploy dist --project-name=lunarhue-forms-docs --branch=main

      - if: steps.release.outputs.deploy == 'true'
        env:
          URL: ${{ steps.production.outputs.deployment-url }}
        run: |
          {
            echo ""
            echo "Deployed to production: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Updates the docs comment docs-deploy.yml left on the Version Packages
      # pull request, or adds one. That is the newest merged one whose merge
      # commit is in this tag's history; without one (or on a manual non-tag
      # deploy), it skips the comment. A failed comment doesn't fail the deploy.
      - if: steps.release.outputs.deploy == 'true' && steps.release.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          URL: ${{ steps.production.outputs.deployment-url }}
          # CHANNEL_URLS.release in apps/docs/src/lib/site.ts.
          PRODUCTION_URL: https://forms.lunarhue.dev
        run: |
          pr=""
          while read -r number merge; do
            if [ -n "$merge" ] && git merge-base --is-ancestor "$merge" HEAD 2>/dev/null; then
              pr=$number
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$GITHUB_REPOSITORY_OWNER:changeset-release/main&sort=created&direction=desc&per_page=30" \
            --jq '.[] | select(.merged_at != null) | "\(.number) \(.merge_commit_sha)"')
          if [ -z "$pr" ]; then
            echo "::notice::No merged release pull request leads to $TAG, so there is no comment to update."
            exit 0
          fi
          marker="<!-- docs-deploy -->"
          body="$marker
          **Docs for this release** are live: version ${TAG##*@}.

          | | |
          | --- | --- |
          | Production | $PRODUCTION_URL |
          | This deployment | $URL |"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="$body" > /dev/null
          fi
